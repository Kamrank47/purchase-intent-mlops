apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: purchase-intent-api
  labels:
    app.kubernetes.io/name: purchase-intent-api
    app.kubernetes.io/part-of: purchase-intent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: purchase-intent-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

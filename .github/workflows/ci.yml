name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest

  train:
    name: Train and record metrics
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install .
      - name: Train
        run: intent-train --data data/raw/online_shoppers_intention.csv
      - name: Drift smoke test
        run: |
          intent-monitor \
            --reference data/raw/online_shoppers_intention.csv \
            --current data/raw/online_shoppers_intention.csv \
            --output artifacts/drift.json
      - name: Show metrics
        run: cat artifacts/metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/
          retention-days: 14

  image:
    name: Build and scan image
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: artifacts
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: with-model
          load: true
          push: false
          tags: purchase-intent-mlops:ci
      - name: Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: purchase-intent-mlops:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  manifests:
    name: Validate manifests
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: kubeconform
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          args: -strict -summary -ignore-missing-schemas k8s/base k8s/kserve
